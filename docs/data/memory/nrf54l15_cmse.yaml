# Memory requirement data for nRF54L15 DK with TF-M.
# Partition layout from TF-M DTS; sample usage seeded from documentation values.

board:
  name: nRF54L15 DK with TF-M
  nvm_total_kb: 1524
  ram_total_kb: 256
legend_threshold_kb: 8
stack_threads:
  main:
    title: Main Thread
    kconfig: CONFIG_MAIN_STACK_SIZE
  openthread:
    title: OpenThread Thread
    kconfig: CONFIG_OPENTHREAD_THREAD_STACK_SIZE
  chip:
    title: Matter Thread (CHIP Thread)
    kconfig: CONFIG_CHIP_TASK_STACK_SIZE
layouts:
  tfm:
    partitions:
      - id: boot
        label: MCUboot
        size_kb: 52
        order: 0
      - id: tfm
        label: TF-M ROM
        size_kb: 128
        order: 1
      - id: slot0
        label: Application
        size_kb: 1268
        order: 2
      - id: factory_data
        label: Factory data
        size_kb: 4
        order: 3
      - id: storage
        label: Settings
        size_kb: 40
        order: 4
      - id: tfm_storage
        label: TF-M Storage
        size_kb: 32
        order: 5
reference_regions:
  - id: flash_primary
    title: Internal flash
    total_bytes: 1560576
    base_address: 0
    partitions:
      - id: boot_partition
        label: Bootloader
        size_bytes: 53248
        offset_bytes: 0
      - id: slot0_partition
        label: TF-M and application images
        size_bytes: 1429504
        offset_bytes: 53248
        children:
          - id: slot0_s_partition
            label: TF-M secure image
            size_bytes: 131072
            offset_bytes: 53248
          - id: slot0_ns_partition
            label: TF-M nonsecure image
            size_bytes: 1298432
            offset_bytes: 184320
      - id: factory_data_partition
        label: Factory data
        size_bytes: 4096
        offset_bytes: 1482752
      - id: storage_partition
        label: Non-volatile storage
        size_bytes: 40960
        offset_bytes: 1486848
      - id: tfm_storage_partition
        label: TF-M storage
        size_bytes: 32768
        offset_bytes: 1527808
        children:
          - id: tfm_its_partition
            label: tfm its
            size_bytes: 8192
            offset_bytes: 1527808
          - id: tfm_otp_partition
            label: tfm otp
            size_bytes: 8192
            offset_bytes: 1536000
          - id: tfm_ps_partition
            label: tfm ps
            size_bytes: 16384
            offset_bytes: 1544192
  - id: sram_cpuapp_sram
    title: Static RAM (cpuapp_sram)
    total_bytes: 262144
    base_address: 536870912
    address_note_rst: SRAM is located at the address ``0x20000000`` in the memory address space of the application.
    partitions:
      - id: sram_secure
        label: Secure Static RAM
        size_bytes: 61440
        offset_bytes: 0
      - id: sram_nonsecure
        label: Non-Secure Static RAM
        size_bytes: 200704
        offset_bytes: 61440
samples:
  - label: ':ref:`Light Bulb <matter_light_bulb_sample>` (Debug)'
    layout: tfm
    usage:
      nvm:
        boot: 52
        slot0: 731
        factory_data: 4
        storage: 40
        tfm_storage: 32
      ram_used_kb: 164
  - label: ':ref:`Light Switch <matter_light_switch_sample>` (Debug)'
    layout: tfm
    usage:
      nvm:
        boot: 52
        slot0: 697
        factory_data: 4
        storage: 40
        tfm_storage: 32
      ram_used_kb: 152
  - label: ':ref:`Template <matter_template_sample>` (Debug)'
    layout: tfm
    usage:
      nvm:
        boot: 52
        slot0: 648
        factory_data: 4
        storage: 40
        tfm_storage: 32
      ram_used_kb: 149
  - label: ':ref:`Template <matter_template_sample>` (Release)'
    layout: tfm
    usage:
      nvm:
        boot: 52
        slot0: 512
        factory_data: 4
        storage: 40
        tfm_storage: 32
      ram_used_kb: 145
  - label: ':ref:`Thermostat <matter_thermostat_sample>` (Debug)'
    layout: tfm
    usage:
      nvm:
        boot: 52
        slot0: 706
        factory_data: 4
        storage: 40
        tfm_storage: 32
      ram_used_kb: 151
